<!-- Basic basic template -->
<!DOCTYPE HTML>
<html lang = "en">

<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel = "stylesheet" href="styles.css">
    

</head>

<body class ="dm-sans-regular"> <!--apply font class to the body -->

    <div class="container">

        <!--Login Page-->
        <div class="form-box" id = "login-form"> <!--Creates a form, id is an identifier-->
            <form action=""> <!--form submission currently not being sent anywhere-->
                <h2>login</h2>
                <input type="Email" name ="Email" placeholder ="northwestern.edu email" required>
                <input type="password" name ="password" placeholder ="password" required>
                <button type="submit" name ="login">Login</button> 
                <p>don't have an account? <a href="#">register</a></p>
            </form>
        </div>


        <!--Registration Page-->
        <div class="form-box" id = "register-form">
            <form action=""> 
                <h2>create an account</h2>
                <input type="text" name ="first name" placeholder ="first name" required>
                <input type="text" name ="last name" placeholder ="last name" required>
                <input type="Email" name ="Email" placeholder ="northwestern.edu email" required>
                <input type="password" name ="password" placeholder ="password" required>
                <button type="submit" name ="register">register</button>
                <p>already have an account? <a href="#">log in</a></p> 
                
            </form>
        </div>


    </div>

</body>



</html>
