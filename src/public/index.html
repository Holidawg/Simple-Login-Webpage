<!-- Basic basic template -->
<!DOCTYPE HTML>
<html lang = "en">

<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel = "stylesheet" href="styles.css">
    

</head>

<body class ="dm-sans-regular"> <!--apply font class to the body -->

    <div class="container">

        <!--Login Page-->

        <div class="form-box active" id = "login-form"> <!--Creates a form, id is an identifier, initially in active class-->
            <form action=""> <!--form submission currently not being sent anywhere-->
                <h2>login</h2>
                <input type="Email" name ="Email" placeholder ="northwestern.edu email" required>
                <input type="password" name ="password" placeholder ="password" required>
                <button type="submit" name ="login">Login</button> 
                <!-- Switch to register form 
                 Syntax: function parameter is in single quotes -->
                <p>don't have an account? <a href="#" onclick="showForm('register-form')">register</a></p>
            </form>
        </div>


        <!--Registration Page-->
        <div class="form-box" id = "register-form">
            <!-- Self Learn: Submit to POST /, match the server's field names, and leave room for an error. -->
            <form action="/" method="post">
                <h2>create an account</h2>
                <p id="signup-error" role="alert" hidden></p>
                <input type="text" name ="firstName" placeholder ="first name" required>
                <input type="text" name ="lastName" placeholder ="last name" required>
                <input type="email" name ="email" placeholder ="northwestern.edu email" required>
                <input type="password" name ="password" placeholder ="password" required>
                <button type="submit" name ="register">register</button>
                <p>already have an account? <a href="#" onclick = "showForm('login-form')">log in</a></p> 
                
            </form>
        </div>


    </div>
    <script src ="script.js"></script> <!--This will make the website interactive!-->

</body>



</html>
